[package]
name = "aikun"
version = "0.4.2"
edition = "2024"
description = "A lightweight AI gateway with multi-provider aggregation, failover, and routing optimization"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }

# Database
rusqlite = { version = "0.34", features = ["bundled"] }

# Auth
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.9"

# HTTP client(rustls 替代系统 OpenSSL,便于静态构建)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "socks", "rustls-tls"] }

# 哈希(api key 存储等)
sha2 = "0.10"

# 上游渠道 key 静态加密(AES-256-GCM,密钥派生自 JWT secret)
aes-gcm = "0.10"
base64 = "0.22"

# Streaming (SSE)
futures-util = "0.3"
async-stream = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
# CancellationToken:关停时主动收尾在途流式请求(先记账再退出)
tokio-util = "0.7"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
dotenvy = "0.15"

[dev-dependencies]
# E2E:拉起真实二进制 + axum mock 上游(tests/)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
axum = { version = "0.8", features = ["macros"] }
rusqlite = { version = "0.34", features = ["bundled"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"
jsonwebtoken = "9"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
