# 虚拟 workspace 清单:唯一真相是 openapi.yaml(API)与本文件(结构)。
# default-members 保持根目录裸 cargo build/test/zigbuild 行为与迁移前一致
# (release.yml / Dockerfile 都在根目录跑 cargo zigbuild,产物路径不变)。
[workspace]
members = ["aikun", "crates/*"]
default-members = ["aikun"]
resolver = "3"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
