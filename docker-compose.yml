# Aikun — 轻量 AI 网关
# 用法:
#   1. 复制 env.example 为 .env,设置 AIKUN_JWT_SECRET(必须)
#   2. docker compose up -d
#   3. 首次启动日志会打印随机生成的 admin 密码:docker logs aikun
services:
  aikun:
    # 默认拉取 GHCR 发布镜像;本地构建则执行 docker compose build
    image: ghcr.io/zumpyx/aikun:latest
    build: .
    container_name: aikun
    restart: unless-stopped
    ports:
      # 宿主机端口:容器端口;宿主机 3000 被占用时改左边
      - "3000:3000"
    environment:
      # compose 自动读取同目录 .env;:? 表示未设置时直接报错拒绝启动
      AIKUN_JWT_SECRET: ${AIKUN_JWT_SECRET:?请在 .env 中设置 AIKUN_JWT_SECRET}
      # 其余配置项见 .env.example(全部 AIKUN_ 前缀),按需取消注释:
      # AIKUN_LOG_RETENTION_DAYS: "30"
      # AIKUN_REQUEST_TIMEOUT_SECS: "120"
      # AIKUN_CORS_ALLOWED_ORIGINS: https://your-domain.example
      # AIKUN_TRUST_X_FORWARDED_FOR: "1"   # 仅当位于反向代理之后
    volumes:
      - aikun-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  aikun-data:
