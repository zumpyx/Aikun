name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # lint 与 test 分开:zigbuild 容器没有 rustfmt/clippy 组件,
  # 标准 runner + stable 工具链自带;fmt 不编译,clippy 走 rustls+bundled sqlite 无系统依赖。
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        # cargo-fmt 无 --workspace 旗标,--all 即全 workspace(含生成 crate)
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    # 与 release.yml 同一工具链容器,避免环境差异
    container: ghcr.io/rust-cross/cargo-zigbuild:0.23.0
    steps:
      - uses: actions/checkout@v5

      # zigbuild 镜像 tag 不含 Rust 版本,0.23.0–0.24.1 全部只捆绑 1.93;
      # surrealdb 4 的传递依赖 sysinfo 0.39 MSRV 1.95(整条 0.39 线都是,
      # 不可降级),用镜像内 rustup 装钉版工具链(与本地开发一致)。
      - name: Pin Rust toolchain (1.100.0)
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup default 1.100.0
          rustc --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --locked --workspace

  # 生成物纯净性守卫(五支柱之五):重跑生成管线,与入库副本逐字节比对,
  # 任何差异(改了 spec 未重生成 / 手改生成物)即失败。无 Java——openapi-to-rust 是 Rust 原生。
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (含已安装的钉版生成器)
        uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ~/.cargo/bin

      - name: Install pinned generator (openapi-to-rust 0.24.0)
        run: cargo install openapi-to-rust --version 0.24.0 --locked

      - name: Regenerate and diff
        run: |
          bash scripts/gen-api.sh
          git diff --exit-code -- crates/aikun-openapi

  # 前端构建一致性守卫:frontend/dist 是提交进仓库的构建产物,
  # 重跑 npm build 必须与入库副本逐字节一致(防手改 dist / 忘重建)。
  frontend-rebuild-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Rebuild and diff
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..
          git diff --exit-code -- frontend/dist

  # 完整走一遍 release 的 docker 路径(metadata-action → build-push),
  # 但不推送,只验证 Dockerfile 与元数据输出在 CI 环境中可用。
  docker-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/aikun
          tags: type=raw,value=ci-check

      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
